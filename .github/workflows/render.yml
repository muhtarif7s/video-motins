name: Render Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Render video
        run: npx remotion render src/index.ts MyVideo out/video.mp4

      - name: Create Release and Upload Video
        uses: softprops/action-gh-release@v1
        with:
          tag_name: render-${{ github.run_id }}
          name: Video Render ${{ github.run_id }}
          files: out/video.mp4